# This workflow is used to generate jsonschemas from {community}.model.csv

name: JSON Schema Generation CI/CD for Contexualized CSV

on:

  pull_request:
    branches:
      - main
    # change * to your data-model.csv name if needed
    paths:
      - '**.model.csv'
      - "modules/**"

  release:
    types: [published]

  # push:
  #   branches:
  #     - "*"

jobs:

  generate-jsonschema-from-context:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - csv-file: "./contexts/clinical_model.csv"
            artifact-name: "clinical-json-schema"
          - csv-file: "./contexts/genomic_model.csv"
            artifact-name: "genomic-json-schema"
    steps:
      - uses: actions/checkout@v6
      - name: Check if CSV file exists
        run: |
          if [ ! -f "${{ matrix.csv-file }}" ]; then
            echo "CSV file ${{ matrix.csv-file }} not found, skipping..."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        id: check-file
      - name: Generate JSON Schemas
        if: steps.check-file.outputs.skip == 'false'
        id: generate
        uses: Sage-Bionetworks-Actions/generate-jsonschema@main
        with:
          data-model-source: ${{ matrix.csv-file }}
          data-model-labels: "display_label"
      - name: Upload schemas as artifacts
        if: steps.check-file.outputs.skip == 'false'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: "**/*.json"
          if-no-files-found: warn
      # TODO: will need to add register jsonschema step
      # TODO: will need to add release tag logic
